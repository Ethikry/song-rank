# The ethikry.dev front door (worker.js). Deploy once, and again only when a
# project is added:  npx wrangler deploy --config demo/cloudflare/wrangler.toml
# (after the project's own Worker exists, or the binding below won't resolve).
#
# A custom domain rather than a route: the Worker answers for the whole
# hostname and wrangler creates its DNS record, so the zone needs no records
# of its own (it had none). /projects/<name>/ is handed to that project's
# Worker through a service binding; everything else gets a placeholder until
# ethikry.dev has a home page of its own.
name = "ethikry-projects-router"
main = "worker.js"
compatibility_date = "2025-09-01"
routes = [{ pattern = "ethikry.dev", custom_domain = true }]
workers_dev = false
preview_urls = false

[[services]]
binding = "SONG_RANK"
service = "ethikry-song-rank"
